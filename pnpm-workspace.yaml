packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# One version of every external dependency, for the whole workspace. A package
# declares "catalog:" and gets whatever is pinned here, so two packages cannot
# drift onto different versions of the same library without it showing up as a
# change to this file.
catalog:
  # Vendored from the LVBT repository standard's own git tags rather than a
  # registry — see docs/development/reference/checks.md for what pins this.
  '@lvbt/cli': 'github:LasVegasForTransit/repository-tooling#v0.2.5&path:/packages/cli'
  '@lvbt/eslint-config': 'github:LasVegasForTransit/repository-tooling#v0.2.5&path:/packages/eslint-config'
  '@lvbt/prettier-config': 'github:LasVegasForTransit/repository-tooling#v0.2.5&path:/packages/prettier-config'
  '@lvbt/typescript-config': 'github:LasVegasForTransit/repository-tooling#v0.2.5&path:/packages/typescript-config'
  '@lvbt/vitest-config': 'github:LasVegasForTransit/repository-tooling#v0.2.5&path:/packages/vitest-config'
  '@turbo/gen': '^2.10.7'
  '@typescript-eslint/parser': '^8.65.0'
  '@cloudflare/vitest-pool-workers': '^0.18.8'
  vitest: '^4.1.10'
  '@vitest/coverage-v8': '^4.1.10'
  lint-staged: '^17.2.0'
  '@clack/prompts': '^1.4.0'
  '@cloudflare/workers-types': '^4.20241205.0'
  '@tailwindcss/vite': '^4.3.3'
  '@types/geojson': '^7946.0.15'
  '@types/node': '^24.0.0'
  '@types/react': '^18.3.12'
  '@types/react-dom': '^18.3.1'
  '@vitejs/plugin-react': '^4.3.4'
  dependency-cruiser: '^18.1.1'
  eslint: '^10.8.0'
  eslint-plugin-react-hooks: '^7.1.1'
  fflate: '^0.8.2'
  globals: '^17.11.0'
  hono: '^4.12.34'
  # ESLint loads eslint.config.ts through jiti. Without it the flat config
  # resolves to nothing and every rule silently stops applying.
  jiti: '^2.6.1'
  jscpd: '^5.0.14'
  jsdom: '^29.1.1'
  knip: '^6.32.0'
  lucide-react: '^1.27.0'
  maplibre-gl: '^4.7.1'
  playwright-core: '^1.62.0'
  prettier: '^3.9.6'
  react: '^18.3.1'
  react-dom: '^18.3.1'
  smol-toml: '^1.7.1'
  tailwindcss: '^4.3.3'
  terser: 5.49.0
  tsx: '^4.23.1'
  turbo: '^2.10.5'
  typescript: '^6.0.3'
  vite: '^6.0.3'
  vite-plugin-pwa: '^1.3.0'
  wrangler: '^4.114.0'
  zustand: '^5.0.2'
  sharp: ^0.35.3

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17 || 2.1.3 || 5.0.9
  - fast-uri@3.1.6
  - undici@7.29.0
  - nanoid@3.3.18
  - browserslist@4.28.8

overrides:
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@<3.1.6: ^3.1.6
  undici@>=7.0.0 <7.29.0: ^7.29.0
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption parsing !!omap. Reached only
  # through eslint's config loader, so nothing here ever feeds it untrusted
  # YAML — but the audit gate is a floor, not a judgement call, and 4.x is not
  # getting the fix backported below 4.3.1.
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  # GHSA-2v37-7h3g-55p8: a zero-size custom generator loops indefinitely.
  # Reached only through postcss (vite/vitest/@tailwindcss/vite's build-time
  # use), which never calls nanoid with a caller-controlled size of zero —
  # but the audit gate doesn't know that, and 3.x isn't getting the fix
  # backported below 3.3.18.
  nanoid@<3.3.18: ^3.3.18
  # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx, and GHSA-jc9c-2v87-9jf6: a
  # crash and a prototype write on an untrusted browserslist query, unbounded
  # cache growth, and normalizeStats writing through keys from a
  # browserslist-stats.json it is handed. Only babel, vite, and postcss reach
  # browserslist here, at build time, where the query comes from this
  # repository and none of them passes custom stats — but the audit gate is a
  # floor, not a judgement call.
  browserslist@<4.28.7: ^4.28.7
  # GHSA-fxqj-rqcc-2cmp: the incomplete fix of GHSA-6g55-p6wh-862q, on
  # attacker-controlled CSS. Reached through the same build-time tooling as
  # nanoid above, which only ever parses this repository's own stylesheets.
  postcss@<8.5.23: ^8.5.23
