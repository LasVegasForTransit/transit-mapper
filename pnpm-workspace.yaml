packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts. Everything else installs
# without them, so a compromised package cannot run code at install time.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# A release must be at least one day old before it installs, so a package
# that is compromised and yanked the same day never reaches a repository.
minimumReleaseAge: 1440

# Releases installed before their day is up, each for a stated reason. The
# analytics package is the organization's own and was verified locally; the
# others are the patched versions the security overrides below select.
minimumReleaseAgeExclude:
  - '@lasvegasfortransit/analytics@0.1.0'
  - brace-expansion@1.1.17 || 2.1.6 || 5.0.12
  - fast-uri@3.1.8
  - undici@7.29.1
  - nanoid@3.3.18
  - browserslist@4.28.8

# The published package currently omits its adapter peer metadata.
packageExtensions:
  '@lasvegasfortransit/analytics@0.1.0':
    peerDependenciesMeta:
      '@playwright/test':
        optional: true
      astro:
        optional: true
      react:
        optional: true
      vite:
        optional: true

# Temporary transitive pins for published security fixes not yet selected by
# their direct dependents. The first three are the standard's; the rest are
# this repository's own.
overrides:
  sharp: 0.35.4
  smol-toml: 1.8.0
  svgo: 4.1.0
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  fast-uri@<3.1.8: ^3.1.8
  undici@>=7.0.0 <7.29.1: ^7.29.1
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption parsing !!omap. Reached only
  # through eslint's config loader, so nothing here ever feeds it untrusted
  # YAML — but the audit gate is a floor, not a judgement call, and 4.x is not
  # getting the fix backported below 4.3.1.
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  # GHSA-2v37-7h3g-55p8: a zero-size custom generator loops indefinitely.
  # Reached only through postcss (vite/vitest/@tailwindcss/vite's build-time
  # use), which never calls nanoid with a caller-controlled size of zero —
  # but the audit gate doesn't know that, and 3.x isn't getting the fix
  # backported below 3.3.18.
  nanoid@<3.3.18: ^3.3.18
  # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx, and GHSA-jc9c-2v87-9jf6: a
  # crash and a prototype write on an untrusted browserslist query, unbounded
  # cache growth, and normalizeStats writing through keys from a
  # browserslist-stats.json it is handed. Only babel, vite, and postcss reach
  # browserslist here, at build time, where the query comes from this
  # repository and none of them passes custom stats — but the audit gate is a
  # floor, not a judgement call.
  browserslist@<4.28.7: ^4.28.7
  # GHSA-fxqj-rqcc-2cmp: the incomplete fix of GHSA-6g55-p6wh-862q, on
  # attacker-controlled CSS. Reached through the same build-time tooling as
  # nanoid above, which only ever parses this repository's own stylesheets.
  postcss@<8.5.23: ^8.5.23

# The organization version baseline. Every LVBT repository carries this same
# catalog, so a package declares "catalog:" and two repositories cannot drift
# onto different versions of one tool without it showing up as a change here.
# Renovate keeps it current. Entries after the blank line are this
# repository's own; the standard's entries are never re-pinned here.
catalog:
  '@axe-core/playwright': 4.13.0
  '@astrojs/check': 0.9.10
  '@astrojs/sitemap': 3.7.4
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-types': 5.20260901.1
  '@eslint-community/eslint-plugin-eslint-comments': 4.7.2
  '@eslint/js': 10.0.1
  '@playwright/test': 1.62.1
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@vitejs/plugin-react': 6.1.1
  astro: 7.2.10
  eslint: 10.9.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-sonarjs: 4.2.0
  eslint-plugin-turbo: 2.10.12
  globals: 17.11.0
  hono: 4.13.5
  lint-staged: 17.4.1
  markdownlint-cli2: 0.23.2
