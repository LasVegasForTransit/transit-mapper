packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# One version of every external dependency, for the whole workspace. A package
# declares "catalog:" and gets whatever is pinned here, so two packages cannot
# drift onto different versions of the same library without it showing up as a
# change to this file.
catalog:
  '@turbo/gen': '^2.10.7'
  '@typescript-eslint/parser': '^8.65.0'
  '@cloudflare/vitest-pool-workers': '^0.18.8'
  vitest: '^4.1.10'
  lint-staged: '^17.2.0'
  '@clack/prompts': '^1.4.0'
  '@cloudflare/workers-types': '^4.20241205.0'
  '@eslint/js': '^9.39.5'
  '@radix-ui/react-dialog': '^1.1.20'
  '@radix-ui/react-dropdown-menu': '^2.1.21'
  '@radix-ui/react-popover': '^1.1.20'
  '@tailwindcss/vite': '^4.3.3'
  '@types/geojson': '^7946.0.15'
  '@types/node': '^24.0.0'
  '@types/react': '^18.3.12'
  '@types/react-dom': '^18.3.1'
  '@vitejs/plugin-react': '^4.3.4'
  eslint: '^9.39.5'
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-react-hooks: '^7.1.1'
  fflate: '^0.8.2'
  hono: '^4.6.14'
  lucide-react: '^1.27.0'
  maplibre-gl: '^4.7.1'
  playwright-core: '^1.62.0'
  prettier: '^3.9.6'
  react: '^18.3.1'
  react-dom: '^18.3.1'
  tailwindcss: '^4.3.3'
  terser: 5.49.0
  tsx: '^4.23.1'
  turbo: '^2.10.5'
  typescript: '^6.0.3'
  typescript-eslint: '^8.65.0'
  vite: '^6.0.3'
  vite-plugin-pwa: '^1.3.0'
  wrangler: '^4.114.0'
  workbox-window: '^7.4.1'
  zustand: '^5.0.2'
