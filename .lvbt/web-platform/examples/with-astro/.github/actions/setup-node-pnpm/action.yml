# Managed by LasVegasForTransit/repository-tooling. Do not edit this file;
# `pnpm check:repository-tooling` fails on local changes.
name: Setup Node + pnpm
description: Install the repository's pinned pnpm, cache its store, and install from the lockfile.

runs:
  using: composite
  steps:
    # packageManager in package.json is the one version source; pnpm/action-setup
    # reads it when no version input is supplied.
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: '@lasvegasfortransit'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}

    - name: Install reviewed secret scanner
      if: ${{ hashFiles('.gitleaks.toml') != '' }}
      shell: bash
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            scanner_archive=gitleaks_8.30.1_linux_x64.tar.gz
            scanner_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
            ;;
          Linux/ARM64)
            scanner_archive=gitleaks_8.30.1_linux_arm64.tar.gz
            scanner_sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
            ;;
          *) echo "Unsupported scanner runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        scanner_directory="$(mktemp -d "$RUNNER_TEMP/lvbt-gitleaks.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$scanner_archive" \
          --output "$scanner_directory/$scanner_archive"
        scanner_actual="$(sha256sum "$scanner_directory/$scanner_archive" | cut -d ' ' -f 1)"
        if [ "$scanner_actual" != "$scanner_sha" ]; then
          echo 'Scanner archive checksum did NOT match the reviewed release.' >&2
          exit 1
        fi
        tar -xzf "$scanner_directory/$scanner_archive" -C "$scanner_directory" gitleaks
        chmod +x "$scanner_directory/gitleaks"
        test "$("$scanner_directory/gitleaks" version)" = '8.30.1'
        echo "$scanner_directory" >> "$GITHUB_PATH"
