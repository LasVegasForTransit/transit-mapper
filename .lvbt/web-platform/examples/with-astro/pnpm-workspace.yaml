packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts. Everything else installs
# without them, so a compromised package cannot run code at install time.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# A release must be at least one day old before it installs, so a package
# that is compromised and yanked the same day never reaches a repository.
minimumReleaseAge: 1440

# Temporary transitive pins for published security fixes not yet selected by
# their direct dependents.
overrides:
  sharp: 0.35.4
  smol-toml: 1.8.0

# The organization version baseline. Every LVBT repository carries this same
# catalog, so a package declares "catalog:" and two repositories cannot drift
# onto different versions of one tool without it showing up as a change here.
# Renovate keeps it current.
catalog:
  '@axe-core/playwright': 4.13.0
  '@astrojs/check': 0.9.10
  '@astrojs/sitemap': 3.7.4
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-types': 5.20260901.1
  '@eslint-community/eslint-plugin-eslint-comments': 4.7.2
  '@eslint/js': 10.0.1
  '@playwright/test': 1.62.1
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@vitejs/plugin-react': 6.1.1
  astro: 7.2.10
  eslint: 10.9.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-sonarjs: 4.2.0
  eslint-plugin-turbo: 2.10.12
  globals: 17.11.0
  hono: 4.13.5
  lint-staged: 17.4.1
  markdownlint-cli2: 0.23.2
  markdownlint-rule-relative-links: 5.1.2
  playwright-core: 1.62.1
  prettier: 3.9.6
  prettier-plugin-astro: 0.14.1
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 4.3.3
  tsx: 4.23.13
  turbo: 2.10.12
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  vite: 8.2.2
  vitest: 4.1.11
