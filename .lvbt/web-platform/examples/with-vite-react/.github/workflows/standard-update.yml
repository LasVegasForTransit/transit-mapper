# Keeps this repository on the latest release of the LVBT repository standard.
# Each day it compares .lvbt/web-platform.json with the newest release of
# repository-tooling. When a release is newer, it applies it with the
# release's own updater and opens one pull request that merges itself once
# Validate passes. It uses only this workflow's own token.
#
# The token may not change workflow files, so this file stays small and the
# work lives in the vendored standard. If a release changes a workflow file,
# the run fails and names the file to copy by hand.
name: Standard update

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: standard-update
  cancel-in-progress: false

jobs:
  update:
    name: Update the standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Open the update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node .lvbt/web-platform/standards/self-update.ts
