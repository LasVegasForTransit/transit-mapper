name: Bug report
description: Report behavior that did not work as expected.
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What is the shortest sequence that demonstrates the problem?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, links, or other useful context if available.
    validations:
      required: false
