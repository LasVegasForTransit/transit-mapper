name = "transitmapper"
main = "src/entry.ts"
compatibility_date = "2025-07-01"

# Worker logs are off by default, which is a poor way to launch: the first
# time something fails in production is the worst time to discover there's no
# record of it. Sampling stays at 100% — traffic here is far too low for the
# cost of keeping everything to matter.
[observability]
enabled = true
head_sampling_rate = 1

# Serve the built SPA. The Worker handles /api/*, share pages and embeds;
# everything else is a static asset (SPA fallback to index.html).
#
# The Worker deliberately does NOT run first. An asset served without invoking
# it is free and unlimited; any request that reaches it is a billed
# invocation against a 100k/day free allowance, and requests past that get a
# 429 rather than falling back to serving the asset. With `run_worker_first =
# true` every JS chunk, stylesheet and favicon on every page load was one of
# those — roughly a dozen per visit, for no reason.
#
# Scoped to the paths that genuinely need Worker logic. Everything else —
# every JS chunk, stylesheet and favicon — is served straight from assets,
# free and without invoking anything.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/s/*", "/e/*", "/v/*", "/embed/*"]


# Share creation is the only endpoint that writes caller-supplied bytes to
# storage (the preview card), so it's the one that needs a ceiling on how fast
# a script can call it. Validation bounds a single upload; this bounds the
# rate. D1's free allowance is 500MB and a card is capped at 120KB, so without
# this a determined caller could fill the database in an afternoon.
#
# Deliberately a binding rather than a dashboard rate-limiting rule: it lives
# with the code that needs it, it's reviewable in a diff, and it doesn't
# depend on someone remembering to recreate a rule. `period` may only be 10 or
# 60 seconds. 20 creates a minute is far above anything a person does by hand
# and far below what a script needs to be a problem.
[[ratelimits]]
name = "SHARE_CREATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Publishing a View creates another caller-controlled D1 row. It uses its own
# budget so a client cannot exhaust system sharing by creating View records,
# or bypass this limit by alternating between the two resources.
[[ratelimits]]
name = "VIEW_CREATE_LIMITER"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 20
  period = 60

# Anonymous RUM is intentionally low-volume (one or five percent of sessions)
# and every accepted body still becomes a D1 write. Ten samples per address
# per minute leaves room for reloads and multiple tabs without offering an
# unbounded public write primitive.
[[ratelimits]]
name = "PERFORMANCE_SAMPLE_LIMITER"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 10
  period = 60

# Nominatim permits at most one request per second and forbids client-side
# autocomplete. Search is explicit in the UI, cached for seven days, and this
# separate per-client ceiling prevents one browser from consuming the beta's
# whole upstream budget.
[[ratelimits]]
name = "PLACE_SEARCH_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Cache misses share one deliberately conservative upstream budget per
# Cloudflare location. This is an early abuse shield; PLACE_SEARCH_GATE below
# is the strongly consistent authority that enforces Nominatim's aggregate
# one-request-per-second application limit across every location.
[[ratelimits]]
name = "PLACE_UPSTREAM_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 1
  period = 10

[[durable_objects.bindings]]
name = "PLACE_SEARCH_GATE"
class_name = "PlaceSearchGate"

# Declarative class lifecycle avoids a D1 migration and provisions the
# recommended SQLite-backed Durable Object on the first deployment.
[exports.PlaceSearchGate]
type = "durable-object"
storage = "sqlite"

# Metro imports need many bounded Overpass tiles. Sixty per minute lets one
# sequential import advance while preventing parallel scripts from turning
# this Worker into a public-mirror amplifier.
[[ratelimits]]
name = "OSM_TILE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 60
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "transitmapper"
database_id = "5516498a-4473-468e-a1c9-a9dee4762960"
migrations_dir = "src/migrations"

[[r2_buckets]]
binding = "GTFS_ARCHIVES"
bucket_name = "transitmapper-data"

[triggers]
crons = ["0 0 * * *"]

[[routes]]
pattern = "map.lasvegasfortransit.org"
custom_domain = true

[vars]
# Used to build absolute URLs (og:url, canonical) for share pages.
# Override locally via a gitignored .dev.vars (SITE_URL=http://localhost:8787)
# if you want locally-fetched tags to reflect the real local origin.
SITE_URL = "https://map.lasvegasfortransit.org"
# Kept in configuration because Nominatim requires applications to be able to
# switch providers without shipping new browser or Worker code.
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"

# --- Pull request previews ---------------------------------------------------
#
# Every push to an open pull request from a branch in this repository deploys a
# separate Worker, `transitmapper-pr-<number>`, from this environment:
#
#   wrangler deploy --env preview --name transitmapper-pr-<number> \
#     --var SITE_URL:https://transitmapper-pr-<number>.<subdomain>.workers.dev
#
# A separate Worker rather than a version preview URL: Cloudflare does not
# generate `wrangler versions upload` preview URLs for a Worker that implements
# a Durable Object, and this one implements PLACE_SEARCH_GATE.
#
# In this file rather than a `wrangler.preview.toml`: scripts/check-config.ts
# permits exactly one wrangler.toml per module root. A second config file fails
# its "configuration under a name only its own tool knows" rule.
#
# The rest of the reasoning is in
# docs/development/explanation/preview-deployments.md.
#
# Because a named environment now exists, every `wrangler` command without
# `--env` warns that no target environment was specified. It still acts on the
# production configuration above, which is what the release deploy wants.
[env.preview]

# `routes` is an inheritable key, and inheriting it is destructive: an
# environment that inherits a custom-domain route reassigns that domain to its
# own Worker on deploy, so every preview would take map.lasvegasfortransit.org
# away from production. Wrangler warns and then does it. An empty array is not
# nullish, so it overrides the inherited value rather than falling back to it.
routes = []

# With no routes the workers.dev subdomain is on by default, but that default is
# derived from `routes`. Stated so the preview stays reachable independently of
# the line above.
workers_dev = true

# Per-version preview URLs are never generated for a Worker implementing a
# Durable Object. Off, rather than advertising a URL that does not resolve.
preview_urls = false

# `triggers` is inherited too. Without this, every open pull request would run
# the daily maintenance cron against the shared preview database.
[env.preview.triggers]
crons = []

# Everything below is non-inheritable — vars, d1_databases, r2_buckets,
# durable_objects and ratelimits are dropped rather than inherited, and wrangler
# only warns. scripts/tests/wrangler-preview-env.test.ts asserts this block
# declares the same binding names as the top level, so adding a binding above
# without adding it here fails `pnpm verify` instead of failing at runtime in a
# preview whose logs nobody reads.
[env.preview.vars]
# A deliberately non-resolving placeholder, replaced per deployment by
# `wrangler deploy --var SITE_URL:<preview url>`. It cannot hold the real host:
# `wrangler types` unions the literal value of every environment's vars into
# __BaseEnv_Env, so a per-pull-request value here would make the committed
# worker-configuration.d.ts wrong on every pull request.
SITE_URL = "https://transitmapper-preview.invalid"
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"

# One shared preview database for every pull request, not one per branch: D1 has
# no branching primitive, so a database per pull request means creating and
# destroying an account resource from CI on every open and close. Safe because
# scripts/check-migrations-append-only.ts already forbids destructive
# migrations, so an older branch keeps working against a newer branch's schema.
# It holds nothing worth keeping — reset it by recreating it.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "transitmapper-preview"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/migrations"

# The production bucket, deliberately: the Worker only ever reads GTFS archives,
# so a preview cannot corrupt it, and a second bucket would need its own feed
# refresh before it held anything worth previewing against.
[[env.preview.r2_buckets]]
binding = "GTFS_ARCHIVES"
bucket_name = "transitmapper-data"

# `exports` is inheritable, so [exports.PlaceSearchGate] above provisions the
# SQLite-backed class for this environment too. Only the binding is restated.
[[env.preview.durable_objects.bindings]]
name = "PLACE_SEARCH_GATE"
class_name = "PlaceSearchGate"

# Rate limit namespaces are scoped to the Worker script, so these restate the
# top-level budgets for the preview Worker rather than sharing them. Same ids
# and same limits: a preview that throttles differently is a preview of
# something else.
[[env.preview.ratelimits]]
name = "SHARE_CREATE_LIMITER"
namespace_id = "1001"

  [env.preview.ratelimits.simple]
  limit = 20
  period = 60

[[env.preview.ratelimits]]
name = "VIEW_CREATE_LIMITER"
namespace_id = "1006"

  [env.preview.ratelimits.simple]
  limit = 20
  period = 60

[[env.preview.ratelimits]]
name = "PERFORMANCE_SAMPLE_LIMITER"
namespace_id = "1005"

  [env.preview.ratelimits.simple]
  limit = 10
  period = 60

[[env.preview.ratelimits]]
name = "PLACE_SEARCH_LIMITER"
namespace_id = "1002"

  [env.preview.ratelimits.simple]
  limit = 10
  period = 60

[[env.preview.ratelimits]]
name = "PLACE_UPSTREAM_LIMITER"
namespace_id = "1004"

  [env.preview.ratelimits.simple]
  limit = 1
  period = 10

[[env.preview.ratelimits]]
name = "OSM_TILE_LIMITER"
namespace_id = "1003"

  [env.preview.ratelimits.simple]
  limit = 60
  period = 60
