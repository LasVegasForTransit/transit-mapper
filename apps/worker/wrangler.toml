name = "transitmapper"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# Serve the built SPA. The Worker runs first and handles /api/*; every other
# request is forwarded to the static assets (SPA fallback to index.html).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Preview images are rasterized by resvg (wasm), which has no system fonts
# inside a Worker — the Inter subset it draws titles and legends with is
# imported as raw bytes, so it needs to bundle as a data module rather than
# being parsed as code. `fallthrough` keeps wrangler's own built-in rules
# (notably the .wasm one resvg itself relies on) in effect.
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "transitmapper"
database_id = "5516498a-4473-468e-a1c9-a9dee4762960"
migrations_dir = "src/migrations"

[triggers]
crons = ["0 0 * * *"]

[[routes]]
pattern = "map.lasvegasfortransit.org"
custom_domain = true

[vars]
# Used to build absolute URLs (og:url, canonical) for share pages.
# Override locally via a gitignored .dev.vars (SITE_URL=http://localhost:8787)
# if you want locally-fetched tags to reflect the real local origin.
SITE_URL = "https://map.lasvegasfortransit.org"
