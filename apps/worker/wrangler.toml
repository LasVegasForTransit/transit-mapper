name = "transitmapper"
main = "src/entry.ts"
compatibility_date = "2025-07-01"

# Worker logs are off by default, which is a poor way to launch: the first
# time something fails in production is the worst time to discover there's no
# record of it. Sampling stays at 100% — traffic here is far too low for the
# cost of keeping everything to matter.
[observability]
enabled = true
head_sampling_rate = 1

# Serve the built SPA. The Worker handles /api/*, share pages and embeds;
# everything else is a static asset (SPA fallback to index.html).
#
# The Worker deliberately does NOT run first. An asset served without invoking
# it is free and unlimited; any request that reaches it is a billed
# invocation against a 100k/day free allowance, and requests past that get a
# 429 rather than falling back to serving the asset. With `run_worker_first =
# true` every JS chunk, stylesheet and favicon on every page load was one of
# those — roughly a dozen per visit, for no reason.
#
# Scoped to the paths that genuinely need Worker logic. Everything else —
# every JS chunk, stylesheet and favicon — is served straight from assets,
# free and without invoking anything.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/s/*", "/e/*"]


# Share creation is the only endpoint that writes caller-supplied bytes to
# storage (the preview card), so it's the one that needs a ceiling on how fast
# a script can call it. Validation bounds a single upload; this bounds the
# rate. D1's free allowance is 500MB and a card is capped at 120KB, so without
# this a determined caller could fill the database in an afternoon.
#
# Deliberately a binding rather than a dashboard rate-limiting rule: it lives
# with the code that needs it, it's reviewable in a diff, and it doesn't
# depend on someone remembering to recreate a rule. `period` may only be 10 or
# 60 seconds. 20 creates a minute is far above anything a person does by hand
# and far below what a script needs to be a problem.
[[ratelimits]]
name = "SHARE_CREATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Nominatim permits at most one request per second and forbids client-side
# autocomplete. Search is explicit in the UI, cached for seven days, and this
# separate per-client ceiling prevents one browser from consuming the beta's
# whole upstream budget.
[[ratelimits]]
name = "PLACE_SEARCH_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Cache misses share one deliberately conservative upstream budget per
# Cloudflare location. This is an early abuse shield; PLACE_SEARCH_GATE below
# is the strongly consistent authority that enforces Nominatim's aggregate
# one-request-per-second application limit across every location.
[[ratelimits]]
name = "PLACE_UPSTREAM_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 1
  period = 10

[[durable_objects.bindings]]
name = "PLACE_SEARCH_GATE"
class_name = "PlaceSearchGate"

# Declarative class lifecycle avoids a D1 migration and provisions the
# recommended SQLite-backed Durable Object on the first deployment.
[exports.PlaceSearchGate]
type = "durable-object"
storage = "sqlite"

# Metro imports need many bounded Overpass tiles. Sixty per minute lets one
# sequential import advance while preventing parallel scripts from turning
# this Worker into a public-mirror amplifier.
[[ratelimits]]
name = "OSM_TILE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 60
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "transitmapper"
database_id = "5516498a-4473-468e-a1c9-a9dee4762960"
migrations_dir = "src/migrations"

[triggers]
crons = ["0 0 * * *"]

[[routes]]
pattern = "map.lasvegasfortransit.org"
custom_domain = true

[vars]
# Used to build absolute URLs (og:url, canonical) for share pages.
# Override locally via a gitignored .dev.vars (SITE_URL=http://localhost:8787)
# if you want locally-fetched tags to reflect the real local origin.
SITE_URL = "https://map.lasvegasfortransit.org"
# Kept in configuration because Nominatim requires applications to be able to
# switch providers without shipping new browser or Worker code.
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"
