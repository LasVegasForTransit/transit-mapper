<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --tm-icon-background: #E5471A;
      --tm-icon-foreground: #F7F4EC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --tm-icon-background: #2D2F34;
        --tm-icon-foreground: #FF8A5C;
      }
    }
  </style>
  <defs>
    <filter id="glyph-shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.55" flood-color="#0F1115" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect width="32" height="32" fill="var(--tm-icon-background)" />
  <g transform="translate(4 4)">
    <g
      transform="translate(12 12) scale(0.88) translate(-12 -12) rotate(45 12 12)"
      fill="none"
      stroke="var(--tm-icon-foreground)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glyph-shadow)"
    >
      <circle cx="6" cy="19" r="3" />
      <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
      <circle cx="18" cy="5" r="3" />
    </g>
  </g>
</svg>
