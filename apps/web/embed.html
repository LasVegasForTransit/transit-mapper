<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TransitMapper</title>
    <!-- An embed is someone else's page showing our content; it should never
         itself be indexed or unfurled as a destination. The share page at
         /s/:id is the canonical, linkable version. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-dark-16x16.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="theme-color" content="#E5471A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2D2F34" media="(prefers-color-scheme: dark)" />
    <style>
      /* Self-contained: no Tailwind, no app stylesheet. An embed's whole
         point is to be small, and it has exactly three elements.
         The compact surface uses the same MD3 role vocabulary as the app,
         while preserving the light LVBT paper appearance an embed already
         had in someone else's article. */
      :root {
        color-scheme: light dark;
        --md-sys-color-surface: #f7f4ec;
        --md-sys-color-surface-container: #f7f4ec;
        --md-sys-color-on-surface: #0f1115;
        --md-sys-color-on-surface-variant: #4a4e57;
        --md-sys-color-outline: #0f1115;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --md-sys-color-surface: #111310;
          --md-sys-color-surface-container: #1e201e;
          --md-sys-color-on-surface: #e6e6df;
          --md-sys-color-on-surface-variant: #c6c7c0;
          --md-sys-color-outline: #92938c;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--md-sys-color-surface);
        font-family: 'Public Sans', system-ui, sans-serif;
        color: var(--md-sys-color-on-surface);
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #embed-credit {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 1;
        padding: 4px 8px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--md-sys-color-surface-container) 92%, transparent);
        border: 1px solid var(--md-sys-color-outline);
        font-size: 12px;
        font-weight: 600;
        color: var(--md-sys-color-on-surface);
        text-decoration: none;
      }
      #embed-credit:hover {
        text-decoration: underline;
      }
      #embed-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: var(--md-sys-color-on-surface-variant);
      }
      /* An id rule beats the user agent's `[hidden] { display: none }`, so
         setting the attribute alone would leave "Loading map…" on screen
         forever once the map arrives. */
      #embed-status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <p id="embed-status">Loading map…</p>
    <a id="embed-credit" href="/" target="_blank" rel="noopener">Open in TransitMapper</a>
    <script type="module" src="/src/embed/main.ts"></script>
  </body>
</html>
