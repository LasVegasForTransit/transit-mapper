name: Performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chrome responsiveness (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["desktop"]' || '["desktop","mobile"]') }}
    env:
      XVFB_ARGS: -screen 0 1440x900x24 -nolisten tcp -dpi 96
    steps:
      # runner.temp is unavailable while job-level env is evaluated. Resolve
      # the runner-provided directory after the job starts instead.
      - name: Configure artifact paths
        run: |
          printf '%s\n' \
            "CURRENT_ARTIFACT=$RUNNER_TEMP/transitmapper-performance-current-${{ matrix.profile }}" \
            >> "$GITHUB_ENV"

      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup candidate Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Confirm stable Chrome and virtual display
        run: |
          google-chrome --version
          command -v xvfb-run

      # Pull requests prove the complete cold/warm RTC journey once. One
      # sample is functional evidence, not enough data for a numeric timing
      # verdict. Full repeated audits are deliberate workflow dispatches.
      - name: Exercise candidate RTC smoke
        if: github.event_name == 'pull_request'
        run: >-
          xvfb-run -a --server-args="$XVFB_ARGS" pnpm perf --
          --smoke
          --profile "${{ matrix.profile }}"
          --scenario rtc
          --output "$CURRENT_ARTIFACT"

      - name: Record complete candidate matrix
        if: github.event_name != 'pull_request'
        run: >-
          xvfb-run -a --server-args="$XVFB_ARGS" pnpm perf:record --
          --profile "${{ matrix.profile }}"
          --output "$CURRENT_ARTIFACT"

      - name: Upload reports and recorded Chrome traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CURRENT_ARTIFACT }}
          if-no-files-found: warn
          retention-days: 14

  soak:
    name: Ten-minute RTC leak gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XVFB_ARGS: -screen 0 1440x900x24 -nolisten tcp -dpi 96
    steps:
      # Keep soak artifacts in the runner-owned temporary directory too.
      - name: Configure artifact path
        run: |
          printf '%s\n' \
            "SOAK_ARTIFACT=$RUNNER_TEMP/transitmapper-performance-soak" \
            >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Confirm stable Chrome and virtual display
        run: |
          google-chrome --version
          command -v xvfb-run

      - name: Exercise RTC scale for ten minutes
        run: >-
          xvfb-run -a --server-args="$XVFB_ARGS"
          pnpm perf:soak -- --output "$SOAK_ARTIFACT"

      - name: Upload leak report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOAK_ARTIFACT }}
          if-no-files-found: warn
          retention-days: 14
