name: Performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/performance.yml'
  schedule:
    # Run after the busiest shared-runner window, with both desktop and mobile
    # profiles plus the leak soak below.
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chrome responsiveness (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["desktop"]' || '["desktop","mobile"]') }}
    env:
      XVFB_ARGS: -screen 0 1440x900x24 -nolisten tcp -dpi 96
    steps:
      # runner.temp is unavailable while job-level env is evaluated. Resolve
      # the runner-provided directory after the job starts instead.
      - name: Configure artifact paths
        run: |
          printf '%s\n' \
            "CURRENT_ARTIFACT=$RUNNER_TEMP/transitmapper-performance-current-${{ matrix.profile }}" \
            "BASELINE_ARTIFACT=$RUNNER_TEMP/transitmapper-performance-baseline-${{ matrix.profile }}" \
            >> "$GITHUB_ENV"

      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: .performance-baseline
          persist-credentials: false

      - name: Setup candidate Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Confirm stable Chrome and virtual display
        run: |
          google-chrome --version
          command -v xvfb-run

      # A pull request compares only the hard-gate RTC journey on the same
      # runner. Nightly/manual runs below record the complete matrix.
      - name: Detect a measurable base revision
        id: baseline
        run: |
          if test "${{ github.event_name }}" = "pull_request" \
            && test -f .performance-baseline/apps/web/scripts/perf/run.ts; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install base revision
        if: steps.baseline.outputs.available == 'true'
        working-directory: .performance-baseline
        run: |
          pnpm install --frozen-lockfile
          # The base revision is measured for comparison, not accepted as a
          # release candidate. Use the candidate's current bundle policy so a
          # historical, overly-tight budget cannot prevent it from emitting
          # the report that the candidate's required baseline gate consumes.
          cp ../apps/web/perf.config.ts apps/web/perf.config.ts

      - name: Measure base RTC journey
        if: steps.baseline.outputs.available == 'true'
        # A pre-existing absolute violation must not prevent collecting the
        # comparison data. The candidate run below remains the hard gate.
        continue-on-error: true
        working-directory: .performance-baseline
        run: >-
          xvfb-run -a --server-args="$XVFB_ARGS" pnpm perf --
          --profile "${{ matrix.profile }}"
          --scenario rtc
          --output "$BASELINE_ARTIFACT"

      - name: Measure candidate RTC journey
        if: github.event_name == 'pull_request'
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          if test "$BASELINE_AVAILABLE" = "true"; then
            xvfb-run -a --server-args="$XVFB_ARGS" pnpm perf -- \
              --profile "${{ matrix.profile }}" \
              --scenario rtc \
              --output "$CURRENT_ARTIFACT" \
              --baseline "$BASELINE_ARTIFACT/report.json" \
              --require-baseline
          else
            echo "::notice::No compatible base harness; enforcing absolute RTC budgets."
            xvfb-run -a --server-args="$XVFB_ARGS" pnpm perf -- \
              --profile "${{ matrix.profile }}" \
              --scenario rtc \
              --output "$CURRENT_ARTIFACT"
          fi

      - name: Record complete candidate matrix
        if: github.event_name != 'pull_request'
        run: >-
          xvfb-run -a --server-args="$XVFB_ARGS" pnpm perf:record --
          --profile "${{ matrix.profile }}"
          --output "$CURRENT_ARTIFACT"

      - name: Upload reports and recorded Chrome traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CURRENT_ARTIFACT }}
            ${{ env.BASELINE_ARTIFACT }}
          if-no-files-found: warn
          retention-days: 14

  soak:
    name: Ten-minute RTC leak gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XVFB_ARGS: -screen 0 1440x900x24 -nolisten tcp -dpi 96
    steps:
      # Keep soak artifacts in the runner-owned temporary directory too.
      - name: Configure artifact path
        run: |
          printf '%s\n' \
            "SOAK_ARTIFACT=$RUNNER_TEMP/transitmapper-performance-soak" \
            >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Confirm stable Chrome and virtual display
        run: |
          google-chrome --version
          command -v xvfb-run

      - name: Exercise RTC scale for ten minutes
        run: >-
          xvfb-run -a --server-args="$XVFB_ARGS"
          pnpm perf:soak -- --output "$SOAK_ARTIFACT"

      - name: Upload leak report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOAK_ARTIFACT }}
          if-no-files-found: warn
          retention-days: 14
