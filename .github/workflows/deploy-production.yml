name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_performance:
        description: Continue after failed performance gates
        required: false
        default: false
        type: boolean
      override_reason:
        description: Reason for continuing after failed performance gates
        required: false
        type: string
      deploy_existing_tag:
        description: Existing published release tag to deploy
        required: false
        type: string

permissions:
  contents: read

# Never cancel a prod deploy in flight — let it finish, then queue the next.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # CI itself doesn't run on main (it triggers on pull requests and on pushes
  # to other branches), so before this existed a push to main went straight to
  # production with nothing typechecked and no tests run. Calling the CI
  # workflow rather than repeating its steps keeps one source of truth for
  # what "validated" means.
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # Release Please may create the next mergeable branch, so its inputs must
  # pass the reusable production-build smokes before it writes that branch or
  # creates a tag. The called workflow owns these jobs; this workflow only
  # orders them with the release and deploy stages.
  performance:
    name: Release performance gates
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_existing_tag == ''
    uses: ./.github/workflows/performance.yml

  # Conventional commits are the only release input. Release Please maintains
  # the release PR, root version, changelog, tag, and GitHub release together.
  release:
    name: Prepare or publish release
    needs: [validate, performance]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (
          needs.performance.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.override_performance == true &&
            inputs.override_reason != '' &&
            (
              needs.performance.result == 'failure' ||
              (
                inputs.deploy_existing_tag != '' &&
                needs.performance.result == 'skipped'
              )
            )
          )
        )
      }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.existing-release.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.existing-release.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - name: Record performance gate override
        if: needs.performance.result != 'success'
        env:
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          set -euo pipefail
          if [ -z "${OVERRIDE_REASON//[[:space:]]/}" ]; then
            echo "A nonblank override reason is required." >&2
            exit 1
          fi
          {
            echo "## Performance gate override"
            echo
            echo "The manual release continued after the performance workflow reported \`$PERFORMANCE_RESULT\`."
            echo
            echo "Reason: $OVERRIDE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve existing release
        id: existing-release
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_existing_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.deploy_existing_tag }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          tag=$(jq -er '.tag_name' <<< "$release")
          draft=$(jq -er '.draft | tostring' <<< "$release")
          if [ "$draft" != 'false' ]; then
            echo "Release $tag is still a draft." >&2
            exit 1
          fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Run Release Please
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_existing_tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch validation for generated release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          release_branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          # Pull requests created with GITHUB_TOKEN do not emit another
          # pull_request event. Dispatch the one authoritative repository
          # checks explicitly so the generated branch can satisfy the ruleset.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
          gh workflow run performance.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch" \
            --field scope=release

  deploy:
    name: Attest and deploy release to Cloudflare Workers
    needs: [validate, release]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.release.result == 'success' &&
        needs.release.outputs.release_created == 'true'
      }}
    permissions:
      attestations: write
      contents: write
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scopes secrets to the production environment + surfaces a deployment
    # record in the GitHub UI. Add required reviewers via repo settings if
    # you want a manual approval gate later.
    environment:
      name: production
      url: https://map.lasvegasfortransit.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate selected release
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_existing_tag != ''
        run: pnpm check

      # Built BEFORE the migration step, not as part of the deploy. The build
      # is pure, local and fallible — a vite failure has nothing to do with
      # the schema — and running it after the migration would leave production
      # with a migrated database and the old code for a reason unrelated to
      # either. Everything that can fail without consequence happens first.
      - name: Build release
        env:
          TRANSITMAPPER_RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: pnpm run build

      # Wrangler's dry run creates the exact Worker module that will be
      # archived, attested, and deployed below. Deployment uses --no-bundle so
      # it cannot silently replace the attested bytes with a second build.
      - name: Bundle Worker
        run: |
          set -euo pipefail
          worker_bundle="$RUNNER_TEMP/transitmapper-worker"
          rm -rf "$worker_bundle"
          pnpm --filter @transitmapper/worker exec wrangler deploy --dry-run --outdir "$worker_bundle"

      - name: Package deployment artifact
        id: package
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/transitmapper-release"
          archive="$RUNNER_TEMP/transitmapper-${RELEASE_TAG}-deployment.tar.gz"
          worker_bundle="$RUNNER_TEMP/transitmapper-worker"
          rm -rf "$payload"
          mkdir -p "$payload/apps/web/dist" "$payload/apps/worker/dist" "$payload/apps/worker/src/migrations"
          cp -R apps/web/dist/. "$payload/apps/web/dist/"
          mapfile -t worker_entries < <(find "$worker_bundle" -maxdepth 1 -type f -name '*.js' ! -name '*.js.map' -print)
          if [ "${#worker_entries[@]}" -ne 1 ]; then
            echo "Expected exactly one top-level Worker JavaScript entry in $worker_bundle; found ${#worker_entries[@]}." >&2
            printf 'Candidates:\n%s\n' "${worker_entries[*]:-<none>}" >&2
            exit 1
          fi
          cp -R "$worker_bundle/." "$payload/apps/worker/dist/"
          cp apps/worker/wrangler.toml "$payload/apps/worker/wrangler.toml"
          cp -R apps/worker/src/migrations/. "$payload/apps/worker/src/migrations/"
          tar -C "$payload" -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest deployment artifact
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach artifact and attestation to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.attest.outputs.bundle-path }}" \
            --clobber

      # Extracting the signed archive before deployment makes the release
      # asset, the attestation subject, and the production inputs identical.
      - name: Extract attested deployment artifact
        id: extract
        run: |
          set -euo pipefail
          deploy_root="$RUNNER_TEMP/transitmapper-deploy"
          rm -rf "$deploy_root"
          mkdir -p "$deploy_root"
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$deploy_root"
          echo "root=$deploy_root" >> "$GITHUB_OUTPUT"

      # Schema next. `wrangler deploy` does not apply migrations, so until now
      # the two travelled on separate tracks with nothing ordering them: a
      # release whose code read a column the database didn't have yet would
      # deploy cleanly and then 500 on every share.
      #
      # Applying before deploying is the safe order for additive migrations
      # (a new column the running code simply ignores). A destructive one is
      # not safe in either order and needs to be split across two releases —
      # see docs/operations/how-to/operations.md.
      - name: Apply D1 migrations
        env:
          DEPLOY_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          pnpm --filter @transitmapper/worker exec wrangler d1 migrations apply DB \
            --remote \
            --config "$DEPLOY_ROOT/apps/worker/wrangler.toml"

      - name: Deploy
        env:
          DEPLOY_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          worker_bundle="$DEPLOY_ROOT/apps/worker/dist"
          mapfile -t worker_entries < <(find "$worker_bundle" -maxdepth 1 -type f -name '*.js' ! -name '*.js.map' -print)
          if [ "${#worker_entries[@]}" -ne 1 ]; then
            echo "Expected exactly one top-level Worker JavaScript entry in $worker_bundle; found ${#worker_entries[@]}." >&2
            printf 'Candidates:\n%s\n' "${worker_entries[*]:-<none>}" >&2
            exit 1
          fi
          pnpm --filter @transitmapper/worker exec wrangler deploy \
            "${worker_entries[0]}" \
            --config "$DEPLOY_ROOT/apps/worker/wrangler.toml" \
            --no-bundle \
            --assets "$DEPLOY_ROOT/apps/web/dist"

      # A green deploy only proves the upload succeeded, not that the Worker is
      # serving the routes it was built for. The assertions, and the outage
      # that produced each one, live in the script — shared with the pull
      # request preview deploy so both check the same things.
      - name: Verify the deployed site
        uses: ./.github/actions/verify-deployed-site
        with:
          site: https://map.lasvegasfortransit.org
          dist: ${{ steps.extract.outputs.root }}/apps/web/dist

      # The smoke test runs AFTER the upload, so a red job here does not mean
      # "nothing shipped" — it means something shipped and is not serving
      # correctly. That distinction decides whether you roll back or fix
      # forward, and the person reading a failed run should not have to infer
      # it from step ordering.
      - name: Explain a failed smoke test
        if: failure()
        run: |
          echo "::warning::If 'Verify the deployed site' failed, the Worker is ALREADY deployed — this step does not roll anything back. See docs/operations/how-to/operations.md#roll-back."
