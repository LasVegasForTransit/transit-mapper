name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a prod deploy in flight — let it finish, then queue the next.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # CI itself doesn't run on main (it triggers on pull requests and on pushes
  # to other branches), so before this existed a push to main went straight to
  # production with nothing typechecked and no tests run. Calling the CI
  # workflow rather than repeating its steps keeps one source of truth for
  # what "validated" means.
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # Conventional commits are the only release input. Release Please maintains
  # the release PR, root version, changelog, tag, and GitHub release together.
  release:
    name: Prepare or publish release
    needs: validate
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Validate generated release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          release_branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"

  deploy:
    name: Attest and deploy release to Cloudflare Workers
    needs: [validate, release]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      attestations: write
      contents: write
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes secrets to the production environment + surfaces a deployment
    # record in the GitHub UI. Add required reviewers via repo settings if
    # you want a manual approval gate later.
    environment:
      name: production
      url: https://map.lasvegasfortransit.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Built BEFORE the migration step, not as part of the deploy. The build
      # is pure, local and fallible — a vite failure has nothing to do with
      # the schema — and running it after the migration would leave production
      # with a migrated database and the old code for a reason unrelated to
      # either. Everything that can fail without consequence happens first.
      - name: Build release
        env:
          TRANSITMAPPER_RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: pnpm run build

      # Wrangler's dry run creates the exact Worker module that will be
      # archived, attested, and deployed below. Deployment uses --no-bundle so
      # it cannot silently replace the attested bytes with a second build.
      - name: Bundle Worker
        run: |
          set -euo pipefail
          worker_bundle="$RUNNER_TEMP/transitmapper-worker"
          rm -rf "$worker_bundle"
          pnpm --filter @transitmapper/worker exec wrangler deploy --dry-run --outdir "$worker_bundle"

      - name: Package deployment artifact
        id: package
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/transitmapper-release"
          archive="$RUNNER_TEMP/transitmapper-${RELEASE_TAG}-deployment.tar.gz"
          rm -rf "$payload"
          mkdir -p "$payload/apps/web/dist" "$payload/apps/worker/dist" "$payload/apps/worker/src/migrations"
          cp -R apps/web/dist/. "$payload/apps/web/dist/"
          cp "$RUNNER_TEMP/transitmapper-worker/index.js" "$payload/apps/worker/dist/index.js"
          cp apps/worker/wrangler.toml "$payload/apps/worker/wrangler.toml"
          cp -R apps/worker/src/migrations/. "$payload/apps/worker/src/migrations/"
          tar -C "$payload" -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest deployment artifact
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach artifact and attestation to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.attest.outputs.bundle-path }}" \
            --clobber

      # Extracting the signed archive before deployment makes the release
      # asset, the attestation subject, and the production inputs identical.
      - name: Extract attested deployment artifact
        id: extract
        run: |
          set -euo pipefail
          deploy_root="$RUNNER_TEMP/transitmapper-deploy"
          rm -rf "$deploy_root"
          mkdir -p "$deploy_root"
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$deploy_root"
          echo "root=$deploy_root" >> "$GITHUB_OUTPUT"

      # Schema next. `wrangler deploy` does not apply migrations, so until now
      # the two travelled on separate tracks with nothing ordering them: a
      # release whose code read a column the database didn't have yet would
      # deploy cleanly and then 500 on every share.
      #
      # Applying before deploying is the safe order for additive migrations
      # (a new column the running code simply ignores). A destructive one is
      # not safe in either order and needs to be split across two releases —
      # see docs/how-to/operations.md.
      - name: Apply D1 migrations
        env:
          DEPLOY_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          pnpm --filter @transitmapper/worker exec wrangler d1 migrations apply transitmapper \
            --remote \
            --config "$DEPLOY_ROOT/apps/worker/wrangler.toml"

      - name: Deploy
        env:
          DEPLOY_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          pnpm --filter @transitmapper/worker exec wrangler deploy \
            "$DEPLOY_ROOT/apps/worker/dist/index.js" \
            --config "$DEPLOY_ROOT/apps/worker/wrangler.toml" \
            --no-bundle \
            --assets "$DEPLOY_ROOT/apps/web/dist"

      # A green deploy only proves the upload succeeded. It says nothing about
      # whether the Worker is actually serving the routes it was built for —
      # which is exactly how production spent four days serving a stale build
      # where every share link, preview image and embed silently fell through
      # to the SPA shell, with no failure anywhere to notice.
      #
      # Each check below is one of those symptoms, turned into an assertion.
      - name: Smoke test production
        env:
          DEPLOY_ROOT: ${{ steps.extract.outputs.root }}
          SITE: https://map.lasvegasfortransit.org
        run: |
          set -euo pipefail

          # A share id that cannot exist, so these assert routing rather than data.
          missing="zzzzzzzzzz"
          failed=0

          expect() {
            local label="$1" url="$2" want="$3" actual="$4"
            if [ "$actual" = "$want" ]; then
              echo "  ok  $label"
            else
              echo "FAIL  $label — wanted '$want', got '$actual' ($url)"
              failed=1
            fi
          }

          status() { curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$1"; }
          ctype() { curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$1" | cut -d';' -f1; }
          # Presence, not an exact count — a header duplicated by some future
          # proxy rule shouldn't read as "the header is missing".
          header() { [ "$(curl -sSI --max-time 20 "$1" | tr '[:upper:]' '[:lower:]' | grep -c "^$2:" || true)" -ge 1 ] && echo 1 || echo 0; }

          # What identifies THIS build: vite fingerprints the entry chunk, so
          # the filename changes whenever the app does. Asserting the live
          # site references the chunk we just built is the difference between
          # "the routes look right" and "this is the build we made" — the
          # stale deployment that prompted all of this had perfectly plausible
          # route shapes, it was simply a different build.
          entry=""
          if [ -f "$DEPLOY_ROOT/apps/web/dist/index.html" ]; then
            entry=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' "$DEPLOY_ROOT/apps/web/dist/index.html" | head -1 || true)
          fi

          if [ -n "$entry" ]; then
            echo "expecting entry chunk: $entry"
            # Wait for the new build specifically, not merely for the site to
            # answer. `/` has returned 200 throughout every outage this step
            # exists to catch, so waiting on that would prove nothing.
            #
            # 24 tries / 5s apart = up to 2 minutes. The deploy step above only
            # proves the upload succeeded — Cloudflare's asset propagation to
            # every edge PoP is a separate, best-effort process that can lag
            # behind that by more than the ~30s six tries used to allow, which
            # produced a false "FAIL" here for a deploy that was actually fine
            # (confirmed serving the right chunk within ~2 minutes, unassisted).
            # A genuinely stale/broken deploy won't self-correct no matter how
            # long this waits, so widening the window costs nothing but time on
            # the rare slow-propagation case, and saves a false alarm.
            deployed=0
            for _ in $(seq 1 24); do
              # Keep the successful observation. A second request can reach a
              # different edge that is still propagating and falsely turn a
              # confirmed deployment back into a failure.
              if curl -sS --max-time 20 "$SITE/" | grep -qF "$entry"; then
                deployed=1
                break
              fi
              sleep 5
            done
            expect "the live site serves the build we just made" "$SITE/" "1" "$deployed"
          else
            # Deliberately a warning, not a failure. The deploy has already
            # happened by the time this step runs, so failing the job because
            # a local build artifact is missing would report a broken release
            # on the basis of something that says nothing about the release.
            # The shape assertions below still run.
            echo "::warning::No local build artifact to compare against — skipping the build-identity check."
            # Fall back to waiting for the site to answer at all.
            for _ in 1 2 3 4 5; do
              [ "$(status "$SITE/")" = "200" ] && break
              sleep 5
            done
          fi

          # The Worker runs for /api — a JSON 404, not the SPA shell.
          expect "the API answers unknown shares with JSON" "$SITE/api/systems/$missing" "application/json" "$(ctype "$SITE/api/systems/$missing")"
          expect "the API answers unknown shares with 404" "$SITE/api/systems/$missing" "404" "$(status "$SITE/api/systems/$missing")"

          # The Worker runs for /s — a missing share is 404, not a 200 SPA shell.
          expect "a missing share page is 404, not the SPA shell" "$SITE/s/$missing" "404" "$(status "$SITE/s/$missing")"

          # Preview images are images. Serving HTML here means every pasted
          # link unfurls with a broken card.
          expect "a preview image is a PNG" "$SITE/s/$missing/preview.png" "image/png" "$(ctype "$SITE/s/$missing/preview.png")"
          expect "the site-wide OG image is a PNG" "$SITE/og-image.png" "image/png" "$(ctype "$SITE/og-image.png")"

          # public/ actually shipped. Asserted on content type, not status:
          # the SPA fallback answers 200 for everything, so a status check
          # passes happily while the file itself is missing.
          expect "the web manifest is JSON, not the SPA fallback" "$SITE/manifest.json" "application/json" "$(ctype "$SITE/manifest.json")"

          # The Worker runs for /e too. Framing is the discriminator: the
          # Worker serves embeds with `frame-ancestors *` (the one path on the
          # origin any site may frame), while the asset fallback carries
          # `frame-ancestors 'none'` from _headers. Getting 'none' here means
          # the embed prefix never reached Worker code.
          expect "the embed route reaches the Worker" "$SITE/e/$missing" "1" "$(curl -sSI --max-time 20 "$SITE/e/$missing" | tr '[:upper:]' '[:lower:]' | grep -c 'frame-ancestors \*' || true)"

          # _headers applied. Without it the editor has no CSP and no HSTS.
          expect "assets carry a Content-Security-Policy" "$SITE/" "1" "$(header "$SITE/" "content-security-policy")"
          expect "assets carry HSTS" "$SITE/" "1" "$(header "$SITE/" "strict-transport-security")"

          if [ "$failed" -ne 0 ]; then
            echo "Smoke test failed — production is serving something other than this build."
            exit 1
          fi
          echo "Smoke test passed."

      # The smoke test runs AFTER the upload, so a red job here does not mean
      # "nothing shipped" — it means something shipped and is not serving
      # correctly. That distinction decides whether you roll back or fix
      # forward, and the person reading a failed run should not have to infer
      # it from step ordering.
      - name: Explain a failed smoke test
        if: failure()
        run: |
          echo "::warning::If 'Smoke test production' failed, the Worker is ALREADY deployed — this step does not roll anything back. See docs/how-to/operations.md#roll-back."
