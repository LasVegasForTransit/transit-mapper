name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_performance:
        description: Continue after failed performance gates
        required: false
        default: false
        type: boolean
      override_reason:
        description: Reason for continuing after failed performance gates
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: read
  deployments: write
  attestations: write
  id-token: write

# Retained staging builds and release preparation finish before the next run.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  # CI itself doesn't run on main (it triggers on pull requests and on pushes
  # to other branches), so before this existed a push to main went straight to
  # production with nothing typechecked and no tests run. Calling the CI
  # workflow rather than repeating its steps keeps one source of truth for
  # what "validated" means.
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # Release Please may create the next mergeable branch, so its inputs must
  # pass the reusable production-build smokes before it writes that branch or
  # creates a tag. The called workflow owns these jobs; this workflow only
  # orders them with the release and deploy stages.
  performance:
    name: Release performance gates
    uses: ./.github/workflows/performance.yml

  # Conventional commits are the only release input. Release Please maintains
  # the release PR, root version, changelog, tag, and GitHub release together.
  release:
    name: Prepare or publish release
    needs: [validate, performance]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (
          needs.performance.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.override_performance == true &&
            inputs.override_reason != '' &&
            needs.performance.result == 'failure'
          )
        )
      }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Record performance gate override
        if: needs.performance.result != 'success'
        env:
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          set -euo pipefail
          if [ -z "${OVERRIDE_REASON//[[:space:]]/}" ]; then
            echo "A nonblank override reason is required." >&2
            exit 1
          fi
          {
            echo "## Performance gate override"
            echo
            echo "The manual release continued after the performance workflow reported \`$PERFORMANCE_RESULT\`."
            echo
            echo "Reason: $OVERRIDE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch validation for generated release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          release_branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          # Pull requests created with GITHUB_TOKEN do not emit another
          # pull_request event. Dispatch the one authoritative repository
          # checks explicitly so the generated branch can satisfy the ruleset.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
          gh workflow run performance.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch" \
            --field scope=release

  build:
    needs: [validate, performance, release]
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-build.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      app-directory: apps/worker
      artifact-source: typed-worker
      artifact-prefix: transitmapper-release
      build-environment: production
      require-analytics: true
    secrets: inherit
  attest:
    needs: build
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-attest.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      artifact-prefix: transitmapper-release
    secrets: inherit
  staging:
    needs: [build, attest]
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-publish.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      target: preview
      publication-mode: named-staging
      release-id: ${{ github.run_id }}
      commit: ${{ github.sha }}
      artifact-prefix: transitmapper-release
      attestation-prefix: attestation-transitmapper-release
      app-directory: apps/worker
      acceptance-directory: apps/web
      url: https://transitmapper-preview.las-vegas-for-better-transit.workers.dev
      preview-environment: preview
      production-environment: production
      smoke-script: api
      browser-script: release:acceptance
    secrets: inherit
  archive:
    name: Attach signed retained release to the published version
    needs: [release, build, attest]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: read
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      LVBT_PREVIEW_BINDINGS: ${{ vars.LVBT_PREVIEW_BINDINGS }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Checkout reviewed release tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Download retained Worker, assets, and SQL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transitmapper-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Download signed exact inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-transitmapper-release-${{ github.run_id }}
          path: ${{ runner.temp }}/attestation
      - name: Verify release identity and attach the archived signed inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          pnpm exec lvbt release verify --directory "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --release-id "$GITHUB_RUN_ID" --attestation-directory "$RUNNER_TEMP/attestation"
          archive="$RUNNER_TEMP/transitmapper-${RELEASE_TAG}-deployment.tar.gz"
          tar -C "$RUNNER_TEMP/release" -czf "$archive" .
          gh release upload "$RELEASE_TAG" "$archive" "$RUNNER_TEMP/attestation/release-attestation.json" "$RUNNER_TEMP/attestation/bundle.jsonl"
