name: Contribution metadata

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: contribution-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate contribution metadata policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STATUS_CONTEXT: Contribution metadata
      STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # pull_request_target has a write-capable token. Check out the trusted
      # default branch explicitly and never fetch or execute the PR head.
      - name: Checkout trusted policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Publish pending status
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA"
          -f state=pending
          -f context="$STATUS_CONTEXT"
          -f description="Checking contribution metadata"
          -f target_url="$STATUS_TARGET"

      - name: Validate and publish final status
        run: |
          set +e
          pnpm github:validate --event "$GITHUB_EVENT_PATH" --json > contribution-metadata.json
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            state=success
            description="Contribution metadata is valid"
          elif [ "$result" -eq 1 ]; then
            state=failure
            description="$(node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('contribution-metadata.json','utf8'));process.stdout.write(r.errors[0]?.message.slice(0,140)||'Contribution metadata is invalid')")"
          else
            state=error
            description="Contribution metadata validation could not run"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$STATUS_TARGET"
          exit "$result"
