name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  deployments: write
  packages: read
  pull-requests: write

jobs:
  preview:
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-pr-preview.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      enabled: true
      publication-mode: named-staging
      preview-environment: preview
      protection: public
      app-directory: apps/worker
      preview-script: api
      smoke-script: api
      acceptance-directory: apps/web
      browser-script: release:acceptance
      require-analytics: true
    secrets: inherit
