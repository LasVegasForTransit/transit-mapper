name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  # Callable so the production deploy can gate on exactly these checks
  # instead of restating them. There is one definition of "validated", and
  # both entry points use it.
  workflow_call:

# Least-privilege defaults.
permissions:
  contents: read

# Cancel in-progress CI when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck
        run: pnpm typecheck

      # AGENTS.md makes `pnpm typecheck && pnpm verify` the bar for a pull
      # request, but only the first half was enforced here — the suite could
      # go red and still merge. It needs no browser or network, so there's no
      # reason for CI not to run it.
      - name: Verify
        run: pnpm verify

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
